services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123}
    ports: ["1433:1433"]
    volumes: ["sqlserver_data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-grocerypos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: { context: ., dockerfile: src/Gateway/Gateway.Api/Dockerfile }
    ports: ["5100:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__identity__Destinations__identity__Address: http://identity:8080/
      ReverseProxy__Clusters__products__Destinations__products__Address: http://products:8080/
      ReverseProxy__Clusters__inventory__Destinations__inventory__Address: http://inventory:8080/
      ReverseProxy__Clusters__sales__Destinations__sales__Address: http://sales:8080/
      ReverseProxy__Clusters__payments__Destinations__payments__Address: http://payments:8080/
      ReverseProxy__Clusters__customers__Destinations__customers__Address: http://customers:8080/
      ReverseProxy__Clusters__reports__Destinations__reports__Address: http://reports:8080/
    depends_on:
      identity: { condition: service_started }
      products: { condition: service_started }
      inventory: { condition: service_started }
      sales: { condition: service_started }
      payments: { condition: service_started }
      customers: { condition: service_started }
      reports: { condition: service_started }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"], interval: 10s, timeout: 5s, retries: 10 }

  identity:
    build: { context: ., dockerfile: src/Services/Identity/Identity.Api/Dockerfile }
    ports: ["5101:8080"]
    volumes: ["identity_data:/app/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JsonPersistence__DataPath: "/app/data"
      ConnectionStrings__IdentityDatabase: "Server=(localdb)\\MSSQLLocalDB;Database=GroceryPOS_Identity;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123};TrustServerCertificate=True;Encrypt=False"

  products:
    build: { context: ., dockerfile: src/Services/Products/Products.Api/Dockerfile }
    ports: ["5102:8080"]
    volumes: ["products_data:/app/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JsonPersistence__DataPath: "/app/data"
      ConnectionStrings__ProductsDatabase: "Server=(localdb)\\MSSQLLocalDB;Database=GroceryPOS_Products;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123};TrustServerCertificate=True;Encrypt=False"

  inventory:
    build: { context: ., dockerfile: src/Services/Inventory/Inventory.Api/Dockerfile }
    ports: ["5103:8080"]
    volumes: ["inventory_data:/app/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JsonPersistence__DataPath: "/app/data"
      ConnectionStrings__InventoryDatabase: "Server=(localdb)\\MSSQLLocalDB;Database=GroceryPOS_Inventory;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123};TrustServerCertificate=True;Encrypt=False"

  sales:
    build: { context: ., dockerfile: src/Services/Sales/Sales.Api/Dockerfile }
    ports: ["5104:8080"]
    volumes: ["sales_data:/app/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JsonPersistence__DataPath: "/app/data"
      Services__Products: http://products:8080/
      Services__Inventory: http://inventory:8080/
      Services__Payments: http://payments:8080/
      ConnectionStrings__SalesDatabase: "Server=(localdb)\\MSSQLLocalDB;Database=GroceryPOS_Sales;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-grocerypos}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-change-me}
    depends_on: { rabbitmq: { condition: service_healthy }, products: { condition: service_started }, inventory: { condition: service_started }, payments: { condition: service_started } }

  payments:
    build: { context: ., dockerfile: src/Services/Payments/Payments.Api/Dockerfile }
    ports: ["5105:8080"]
    volumes: ["payments_data:/app/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JsonPersistence__DataPath: "/app/data"
      ConnectionStrings__PaymentsDatabase: "Server=(localdb)\\MSSQLLocalDB;Database=GroceryPOS_Payments;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123};TrustServerCertificate=True;Encrypt=False"

  customers:
    build: { context: ., dockerfile: src/Services/Customers/Customers.Api/Dockerfile }
    ports: ["5106:8080"]
    volumes: ["customers_data:/app/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JsonPersistence__DataPath: "/app/data"
      ConnectionStrings__CustomersDatabase: "Server=(localdb)\\MSSQLLocalDB;Database=GroceryPOS_Customers;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LocalDevOnly!Change123};TrustServerCertificate=True;Encrypt=False"

  reports:
    build: { context: ., dockerfile: src/Services/Reports/Reports.Api/Dockerfile }
    ports: ["5107:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__Sales: http://sales:8080/
      Services__Inventory: http://inventory:8080/
    depends_on: { sales: { condition: service_started }, inventory: { condition: service_started } }

volumes:
  sqlserver_data:
  identity_data:
  products_data:
  inventory_data:
  sales_data:
  payments_data:
  customers_data:
